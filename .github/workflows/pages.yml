name: Publish gh-pages preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build FriendSDK preview
        run: |
          git clone --depth 1 https://github.com/spokesz/friendsdk.git /tmp/friendsdk
          mkdir -p /tmp/friendsdk/games/merge
          cp -R game/. /tmp/friendsdk/games/merge/
          cd /tmp/friendsdk
          npm ci
          npm run build
          npx friendsdk build games/merge
          mkdir -p "$RUNNER_TEMP/preview"
          cp -R games/merge/.friendsdk/. "$RUNNER_TEMP/preview/"
          touch "$RUNNER_TEMP/preview/.nojekyll"
      - name: Push preview to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan gh-pages-temp
          git rm -rf --quiet . || true
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -R "$RUNNER_TEMP/preview"/. .
          git add -A
          git commit -m "Publish The Merge playable preview"
          git branch -M gh-pages
          git push --force origin gh-pages
